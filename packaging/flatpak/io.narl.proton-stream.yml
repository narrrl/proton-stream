# Flatpak manifest. Builds the checkout it sits in, offline, the way Flathub's
# builders do: every crate comes from cargo-sources.json, regenerated by
# scripts/build-flatpak.sh whenever Cargo.lock changes. The Flathub copy of this
# file differs only in the last module's first source, which there is a `git`
# source at the release tag instead of this checkout.
#
# FFmpeg is the runtime's. Its own build leaves out the patent-encumbered
# decoders; the org.freedesktop.Platform.codecs-extra extension the runtime
# pulls in on install replaces it with one that has HEVC and the rest.
id: io.narl.proton-stream
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: proton-stream

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  # Share keys, link passwords and the Proton session live in the keyring.
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  # Media keys and the desktop's now-playing widget (MPRIS).
  - --own-name=org.mpris.MediaPlayer2.proton_stream.*
  - --own-name=org.mpris.MediaPlayer2.proton_stream

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.la'
  - '*.a'

modules:
  - name: libXpresent
    buildsystem: autotools
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/xorg/lib/libxpresent.git
        tag: libXpresent-1.0.2
        commit: 4d92149372461bf575e8a09b1064a2884c38c3aa

  - name: libass
    config-opts:
      - --disable-static
      - --enable-asm
      - --enable-harfbuzz
      - --enable-fontconfig
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        tag: 0.17.5
        commit: 4a05d8127f525943ebf45fdc6497c9e665947f0d

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dvulkan=enabled
      - -Dshaderc=enabled
      - -Ddemos=false
      - -Dtests=false
    sources:
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v7.387.0
        commit: 275f7dea27924cdd34ab2e6c20e448b6bc4fab65

  # libmpv only: the app embeds it, so no mpv binary, no Lua and no JavaScript.
  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dbuild-date=false
      - -Dwerror=false
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dcdda=disabled
      - -Ddvdnav=disabled
      - -Dlibbluray=disabled
      - -Dvapoursynth=disabled
      - -Dcuda-hwaccel=disabled
      - -Dcuda-interop=disabled
      - -Dgl=enabled
      - -Degl=enabled
      - -Dplain-gl=enabled
      - -Dwayland=enabled
      - -Degl-wayland=enabled
      - -Dx11=enabled
      - -Dgl-x11=enabled
      - -Degl-x11=enabled
      - -Dvaapi=enabled
      - -Dvulkan=enabled
      - -Dpulse=enabled
      - -Dpipewire=enabled
      - -Dlcms2=enabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.42.0
        commit: b0841e8c4d156b8403dc1876c4cbd9011eb583f3

  - name: proton-stream
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/proton-stream/cargo
        CARGO_NET_OFFLINE: 'true'
        # libmpv2-sys links `-lmpv` without pkg-config; libmpv is in /app.
        RUSTFLAGS: -L/app/lib
    build-commands:
      - cargo --offline build --release --locked -p pstr-app -p pstr-cli
      - install -Dm755 target/release/proton-stream -t /app/bin/
      - install -Dm755 target/release/pstr -t /app/bin/
      - install -Dm644 packaging/io.narl.proton-stream.desktop -t /app/share/applications/
      - install -Dm644 packaging/io.narl.proton-stream.svg -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 packaging/io.narl.proton-stream.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 LICENSE -t /app/share/licenses/io.narl.proton-stream/
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .build
          - target
          - dist
          - android/build
          - android/app/build
          - ios
      - cargo-sources.json
