[package]
name = "pstr-core"
description = "Shares, catalog model, filename parsing and persistence for proton-stream."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
proton-sdk.workspace = true
proton-drive-rs.workspace = true
tokio.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
directories.workspace = true
rusqlite.workspace = true
proton-base-rs.workspace = true
proton-auth-rs.workspace = true
proton-media-rs.workspace = true
sha2.workspace = true
parking_lot.workspace = true
getrandom.workspace = true

# The OS credential store on desktop. Android and iOS bring their own
# keystore through `SecretStore`, so they do not link a keyring at all.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
proton-auth-rs = { workspace = true, features = ["keyring"] }
